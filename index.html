<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prize Draw Game</title>
<style>
  :root{
    --bg1:#1e1b4b;
    --bg2:#0f172a;
    --accent:#f59e0b;
    --accent2:#ec4899;
    --card:#ffffff;
    --text:#1f2937;
    --muted:#6b7280;
    --danger:#ef4444;
    --success:#10b981;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Segoe UI",Tahoma,Arial,sans-serif;
    background: linear-gradient(135deg,var(--bg1),var(--bg2));
    min-height:100vh;
    color:var(--text);
  }
  .page{display:none; min-height:100vh; padding:24px;}
  .page.active{display:block;}
  .container{max-width:760px;margin:0 auto;}
  h1{color:#fff;text-align:center;font-size:28px;margin-bottom:4px;}
  .subtitle{color:#cbd5e1;text-align:center;margin-bottom:24px;font-size:14px;}
  .card{
    background:var(--card);
    border-radius:16px;
    padding:24px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
    margin-bottom:20px;
  }
  label{font-weight:600;font-size:14px;display:block;margin-bottom:6px;}
  .hint{color:var(--muted);font-size:12px;margin-top:4px;}
  .row{display:flex;gap:16px;flex-wrap:wrap;}
  .field{flex:1;min-width:140px;}
  input[type=number], input[type=text]{
    width:100%;
    padding:10px 12px;
    border:1.5px solid #e2e8f0;
    border-radius:10px;
    font-size:15px;
    outline:none;
    transition:border-color .15s;
  }
  input:focus{border-color:var(--accent);}
  input.error{border-color:var(--danger);}
  .error-msg{color:var(--danger);font-size:13px;margin-top:4px;min-height:16px;}
  .section-title{font-size:16px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  #prizeList{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}
  .prize-item{
    display:flex;align-items:center;gap:10px;
    background:#f8fafc;
    border:1.5px solid #e2e8f0;
    border-radius:12px;
    padding:10px 12px;
    cursor:grab;
  }
  .prize-item.dragging{opacity:.4;}
  .prize-item.drag-over{border-color:var(--accent);border-style:dashed;}
  .drag-handle{color:#94a3b8;font-size:18px;user-select:none;}
  .prize-order{
    background:var(--accent);color:#fff;font-weight:700;
    width:32px;height:32px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;
  }
  .prize-item input{flex:1;}
  .btn{
    border:none;border-radius:10px;padding:10px 18px;font-size:15px;font-weight:600;
    cursor:pointer;transition:transform .1s, box-shadow .15s;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;}
  .btn-secondary{background:#e2e8f0;color:var(--text);}
  .btn-danger{background:transparent;color:var(--danger);font-size:20px;padding:4px 10px;line-height:1;}
  .btn-block{width:100%;padding:14px;font-size:17px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;flex-wrap:wrap;}

  /* Page 2 - Draw */
  #page-draw{position:relative;overflow:hidden;}

  /* Decorative background - two soft, static glows kept subtle so the card stays the focus */
  .decor-circle{
    position:absolute;border-radius:50%;filter:blur(90px);
    opacity:.18;pointer-events:none;z-index:0;
  }
  .decor-1{width:380px;height:380px;background:var(--accent2);top:-130px;left:-110px;}
  .decor-2{width:380px;height:380px;background:var(--accent);bottom:-140px;right:-120px;}

  #drawTopbar{
    position:relative;z-index:1;
    max-width:760px;margin:0 auto;
  }
  .back-link{
    background:none;border:none;color:#cbd5e1;
    font-size:14px;font-weight:600;cursor:pointer;
    padding:8px 4px;transition:color .15s;
  }
  .back-link:hover{color:#fff;}
  .fs-btn{
    position:absolute;top:20px;right:20px;z-index:2;
    width:40px;height:40px;border-radius:50%;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
    color:#e2e8f0;font-size:18px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s;
  }
  .fs-btn:hover{background:rgba(255,255,255,.18);}
  .draw-center{
    position:relative;z-index:1;
    display:flex;align-items:center;justify-content:center;
    min-height:calc(100vh - 110px);
    padding:20px 12px;
  }
  .draw-card{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:32px;
    width:100%;max-width:440px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.1);
    border-radius:24px;
    padding:48px 36px;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
  }
  .draw-info{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;}
  .draw-status{color:#fff;font-size:16px;font-weight:600;min-height:24px;}
  .draw-progress{color:#94a3b8;font-size:13px;min-height:18px;}
  .number-wrap{position:relative;width:220px;height:220px;display:flex;align-items:center;justify-content:center;}
  .number-display{
    position:relative;z-index:1;
    width:220px;height:220px;border-radius:50%;
    background:#fffdf5;
    display:flex;align-items:center;justify-content:center;
    font-size:60px;font-weight:800;color:#92400e;
    border:6px solid rgba(255,255,255,.08);
    box-shadow:0 15px 35px rgba(0,0,0,.35);
    transition:box-shadow .2s, border-color .2s;
  }
  .number-display.rolling{border-color:rgba(245,158,11,.5);box-shadow:0 15px 35px rgba(245,158,11,.25);}
  .result-prize-name{color:var(--accent);font-weight:700;}
  #startDrawBtn{
    font-size:20px;padding:16px 48px;border-radius:60px;
  }
  #startDrawBtn:hover:not(:disabled){
    transform:translateY(-2px);
    box-shadow:0 10px 24px rgba(245,158,11,.35);
  }
  .draw-actions{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;}
  #finishBtn{border-radius:50px;padding:14px 28px;}

  /* Overlays (result modal + summary) */
  .overlay{
    position:fixed;inset:0;background:rgba(15,23,42,.85);
    display:none;align-items:center;justify-content:center;padding:20px;z-index:50;
  }
  .overlay.active{display:flex;}
  .overlay-card{
    position:relative;
    background:#fff;border-radius:18px;padding:28px;max-width:480px;width:100%;
    max-height:85vh;overflow-y:auto;text-align:center;
  }
  .overlay-card.wide{max-width:600px;text-align:left;}
  .overlay-card h2{margin-top:0;text-align:center;}
  .result-modal-text{font-size:20px;margin:20px 0;}
  table{width:100%;border-collapse:collapse;margin-top:12px;}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #e2e8f0;font-size:14px;}
  th{color:var(--muted);font-size:13px;text-transform:uppercase;}
  .num-badge{
    display:inline-block;background:var(--accent);color:#fff;font-weight:700;
    padding:4px 10px;border-radius:8px;
  }

  /* Confetti burst for the result popup */
  .confetti-container{
    position:absolute;inset:0;overflow:hidden;pointer-events:none;
    border-radius:18px;z-index:2;
  }
  .confetti-piece{
    position:absolute;top:-14px;width:8px;height:14px;border-radius:2px;
    opacity:.9;animation:confettiFall 1.6s ease-in forwards;
  }
  @keyframes confettiFall{
    to{ transform:translateY(240px) rotate(540deg); opacity:0; }
  }

  @media (max-width:600px){
    .number-display, .number-wrap{width:170px;height:170px;font-size:46px;}
    #startDrawBtn{font-size:17px;padding:14px 32px;}
    .draw-card{padding:32px 22px;}
    h1{font-size:22px;}
  }
</style>
</head>
<body>

<!-- PAGE 1: SETUP -->
<div class="page active" id="page-setup">
  <div class="container">
    <h1>🎉 Set Up Prize Draw</h1>
    <div class="subtitle">Configure the number range and prize list, then start the game</div>

    <div class="card">
      <div class="section-title">Number Range</div>
      <div class="row">
        <div class="field">
          <label>Start *</label>
          <input type="number" id="startInput" placeholder="e.g. 1" step="1">
          <div class="error-msg" id="startError"></div>
        </div>
        <div class="field">
          <label>End *</label>
          <input type="number" id="endInput" placeholder="e.g. 100" step="1">
          <div class="error-msg" id="endError"></div>
        </div>
      </div>
      <div class="row" style="margin-top:16px;">
        <div class="field">
          <label>Draw Duration (seconds)</label>
          <input type="number" id="durationInput" placeholder="e.g. 3" value="3" min="0.5" step="0.5">
          <div class="hint">How long the number spins before it stops on each draw</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="section-title">
        <span>Prize List</span>
        <button class="btn btn-secondary" id="addPrizeBtn" type="button">+ Add Prize</button>
      </div>
      <div id="prizeList"></div>
      <div class="error-msg" id="prizeError"></div>
    </div>

    <div class="actions">
      <button class="btn btn-primary btn-block" id="startGameBtn" type="button">Start Game 🚀</button>
    </div>
  </div>
</div>

<!-- PAGE 2: DRAW -->
<div class="page" id="page-draw">
  <div class="decor-circle decor-1"></div>
  <div class="decor-circle decor-2"></div>

  <div id="drawTopbar">
    <button class="back-link" id="backBtn" type="button">Back</button>
  </div>
  <button class="fs-btn" id="fullscreenBtn" type="button" title="Full Screen" aria-label="Full Screen">⛶</button>

  <div class="draw-center">
    <div class="draw-card">
      <div class="draw-info">
        <div class="draw-status" id="drawStatusText"></div>
        <div class="draw-progress" id="drawProgressText"></div>
      </div>
      <div class="number-wrap">
        <div class="number-display" id="numberDisplay">?</div>
      </div>
      <div class="draw-actions">
        <button class="btn btn-primary" id="startDrawBtn" type="button">Draw 🎲</button>
        <button class="btn btn-secondary" id="finishBtn" type="button" style="display:none;">Finish 🏁</button>
      </div>
    </div>
  </div>
</div>

<!-- RESULT MODAL (shown after each draw) -->
<div class="overlay" id="resultOverlay">
  <div class="overlay-card">
    <div class="confetti-container" id="confettiContainer"></div>
    <h2>🎉 Result</h2>
    <div class="result-modal-text" id="resultModalText"></div>
    <div class="actions" style="justify-content:center;">
      <button class="btn btn-secondary" id="resultRetryBtn" type="button">↺ Retry</button>
      <button class="btn btn-primary" id="resultCloseBtn" type="button">Continue</button>
    </div>
  </div>
</div>

<!-- SUMMARY OVERLAY -->
<div class="overlay" id="summaryOverlay">
  <div class="overlay-card wide">
    <h2 id="summaryTitle">🏆 Prize Draw Results</h2>
    <table>
      <thead><tr id="summaryHeaderRow"><th>Prize #</th><th>Prize Name</th><th>Number Drawn</th></tr></thead>
      <tbody id="summaryTableBody"></tbody>
    </table>
    <div class="actions">
      <button class="btn btn-secondary" id="closeSummaryBtn" type="button">Close</button>
      <button class="btn btn-primary" id="newGameBtn" type="button">New Game</button>
    </div>
  </div>
</div>

<script>
(function(){
  // ---------- State ----------
  let prizes = []; // {id, name}
  let prizeIdCounter = 0;
  let range = {start:null, end:null};
  let drawDurationMs = 3000; // default 3 seconds

  let drawQueue = [];      // array of prize indices (0-based) in draw order (highest order-number first)
  let drawPointer = 0;
  let results = {};        // prizeIndex -> number
  let drawnNumbers = new Set();
  let isRolling = false;
  let freeMode = false;    // true when no prizes were configured: free (non-repeating) draw mode
  let freeDrawHistory = []; // Free Draw Mode: numbers drawn so far, in draw order
  let lastDrawnNumber = null;   // most recent number drawn (used by Retry to undo it)
  let lastDrawnPrizeIdx = null; // prize index tied to the last draw (null in Free Draw Mode)

  let draggedId = null;

  // ---------- Helpers ----------
  function uid(){ return 'p' + (++prizeIdCounter); }

  function addPrize(){
    prizes.push({id: uid(), name:''});
    renderPrizeList();
  }

  function removePrize(id){
    prizes = prizes.filter(p => p.id !== id);
    renderPrizeList();
  }

  function renderPrizeList(){
    const list = document.getElementById('prizeList');
    list.innerHTML = '';
    prizes.forEach((prize, idx) => {
      const item = document.createElement('div');
      item.className = 'prize-item';
      item.draggable = true;
      item.dataset.id = prize.id;

      item.addEventListener('dragstart', (e) => {
        draggedId = prize.id;
        item.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      item.addEventListener('dragend', () => {
        item.classList.remove('dragging');
        document.querySelectorAll('.prize-item').forEach(el=>el.classList.remove('drag-over'));
      });
      item.addEventListener('dragover', (e) => {
        e.preventDefault();
        item.classList.add('drag-over');
      });
      item.addEventListener('dragleave', () => {
        item.classList.remove('drag-over');
      });
      item.addEventListener('drop', (e) => {
        e.preventDefault();
        item.classList.remove('drag-over');
        if(!draggedId || draggedId === prize.id) return;
        const fromIdx = prizes.findIndex(p=>p.id===draggedId);
        const toIdx = prizes.findIndex(p=>p.id===prize.id);
        const [moved] = prizes.splice(fromIdx,1);
        prizes.splice(toIdx,0,moved);
        renderPrizeList();
      });

      const handle = document.createElement('span');
      handle.className = 'drag-handle';
      handle.textContent = '⠿';

      const order = document.createElement('div');
      order.className = 'prize-order';
      order.textContent = idx+1;

      const input = document.createElement('input');
      input.type = 'text';
      input.placeholder = 'Prize description (optional)';
      input.value = prize.name;
      input.addEventListener('input', (e) => {
        prize.name = e.target.value;
      });

      const delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'btn btn-danger';
      delBtn.textContent = '✕';
      delBtn.addEventListener('click', () => removePrize(prize.id));

      item.appendChild(handle);
      item.appendChild(order);
      item.appendChild(input);
      item.appendChild(delBtn);
      list.appendChild(item);
    });
  }

  function validateSetup(){
    let ok = true;
    const startVal = document.getElementById('startInput').value;
    const endVal = document.getElementById('endInput').value;
    const startErr = document.getElementById('startError');
    const endErr = document.getElementById('endError');
    const prizeErr = document.getElementById('prizeError');
    const startInputEl = document.getElementById('startInput');
    const endInputEl = document.getElementById('endInput');

    startErr.textContent=''; endErr.textContent=''; prizeErr.textContent='';
    startInputEl.classList.remove('error'); endInputEl.classList.remove('error');

    let startIsValid = true;
    let endIsValid = true;

    if(startVal === '' ){
      startErr.textContent = 'Please enter Start';
      startInputEl.classList.add('error');
      ok = false;
      startIsValid = false;
    } else if(!Number.isInteger(Number(startVal))){
      startErr.textContent = 'Start must be a whole number';
      startInputEl.classList.add('error');
      ok = false;
      startIsValid = false;
    }

    if(endVal === ''){
      endErr.textContent = 'Please enter End';
      endInputEl.classList.add('error');
      ok = false;
      endIsValid = false;
    } else if(!Number.isInteger(Number(endVal))){
      endErr.textContent = 'End must be a whole number';
      endInputEl.classList.add('error');
      ok = false;
      endIsValid = false;
    }

    if(startIsValid && endIsValid){
      const s = Number(startVal), e = Number(endVal);
      if(s > e){
        endErr.textContent = 'End must be greater than or equal to Start';
        endInputEl.classList.add('error');
        startInputEl.classList.add('error');
        ok = false;
      } else {
        range.start = s; range.end = e;
        if(prizes.length > (e - s + 1)){
          prizeErr.textContent = 'Number of prizes ('+prizes.length+') exceeds the numbers available in the range ('+(e-s+1)+')';
          ok = false;
        }
      }
    }
    // Note: an empty prize list is allowed — it enables Free Draw Mode on the Draw page.

    // Draw duration (optional, defaults to 3s if invalid/empty)
    const durationVal = Number(document.getElementById('durationInput').value);
    drawDurationMs = (durationVal && durationVal > 0) ? durationVal * 1000 : 3000;

    return ok;
  }

  function buildDrawQueue(){
    freeMode = prizes.length === 0;
    // draw from last order (highest) to first (order 1 / grand prize) last
    drawQueue = [];
    for(let i = prizes.length-1; i>=0; i--) drawQueue.push(i);
    drawPointer = 0;
    results = {};
    drawnNumbers = new Set();
    freeDrawHistory = [];
    lastDrawnNumber = null;
    lastDrawnPrizeIdx = null;
  }

  function buildPool(){
    const pool = [];
    for(let n = range.start; n <= range.end; n++){
      if(!drawnNumbers.has(n)) pool.push(n);
    }
    return pool;
  }

  function goToPage(id){
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function updateDrawUI(){
    const statusEl = document.getElementById('drawStatusText');
    const progEl = document.getElementById('drawProgressText');
    const startBtn = document.getElementById('startDrawBtn');
    const finishBtn = document.getElementById('finishBtn');

    if(freeMode){
      const total = range.end - range.start + 1;
      if(freeDrawHistory.length >= total){
        statusEl.textContent = 'All numbers in the range have been drawn 🎊';
        progEl.textContent = '';
        startBtn.style.display = 'none';
        finishBtn.style.display = 'none';
        showSummary();
        return;
      }
      statusEl.textContent = 'Free Draw Mode 🎲';
      progEl.textContent = 'Drawn ' + freeDrawHistory.length + ' / ' + total + ' numbers';
      startBtn.style.display = '';
      startBtn.disabled = false;
      finishBtn.style.display = '';
      return;
    }
    finishBtn.style.display = 'none';

    if(drawPointer >= drawQueue.length){
      statusEl.textContent = 'All prizes have been drawn 🎊';
      progEl.textContent = '';
      startBtn.style.display = 'none';
      showSummary();
      return;
    }
    const prizeIdx = drawQueue[drawPointer];
    const order = prizeIdx+1;
    const name = prizes[prizeIdx].name.trim();
    statusEl.textContent = 'Drawing Prize #' + order + (name? ' — ' + name : '');
    progEl.textContent = 'Drawn ' + drawPointer + ' / ' + drawQueue.length + ' prizes';
    startBtn.style.display = '';
    startBtn.disabled = false;
  }

  function drawNumber(){
    if(isRolling) return;
    if(!freeMode && drawPointer >= drawQueue.length) return;
    isRolling = true;
    const startBtn = document.getElementById('startDrawBtn');
    startBtn.disabled = true;
    const display = document.getElementById('numberDisplay');
    display.classList.add('rolling');

    // build remaining pool (non-repeating; Draw is disabled once the pool is exhausted)
    const pool = buildPool();
    if(pool.length === 0){
      // shouldn't happen: the Draw button is disabled/hidden once all numbers are drawn
      isRolling = false;
      display.classList.remove('rolling');
      startBtn.disabled = false;
      return;
    }
    const finalNumber = pool[Math.floor(Math.random()*pool.length)];

    let elapsed = 0;
    const totalDuration = drawDurationMs;
    let intervalDelay = 40;
    const spin = () => {
      display.textContent = range.start + Math.floor(Math.random()*(range.end-range.start+1));
      elapsed += intervalDelay;
      if(elapsed < totalDuration){
        intervalDelay = Math.min(intervalDelay + 12, 220);
        setTimeout(spin, intervalDelay);
      } else {
        finishDraw(finalNumber);
      }
    };
    spin();
  }

  function finishDraw(finalNumber){
    const display = document.getElementById('numberDisplay');
    display.textContent = finalNumber;
    display.classList.remove('rolling');
    drawnNumbers.add(finalNumber);
    isRolling = false;
    lastDrawnNumber = finalNumber;

    if(freeMode){
      freeDrawHistory.push(finalNumber);
      lastDrawnPrizeIdx = null;
      showResultModal(finalNumber, null);
      return;
    }

    const prizeIdx = drawQueue[drawPointer];
    results[prizeIdx] = finalNumber;
    lastDrawnPrizeIdx = prizeIdx;
    drawPointer++;

    showResultModal(finalNumber, prizeIdx);
  }

  function retryDraw(){
    if(isRolling) return;
    if(lastDrawnNumber === null) return; // nothing to undo

    // Undo the just-drawn number so it can be redrawn
    drawnNumbers.delete(lastDrawnNumber);

    if(freeMode){
      if(freeDrawHistory.length > 0 && freeDrawHistory[freeDrawHistory.length-1] === lastDrawnNumber){
        freeDrawHistory.pop();
      }
    } else if(lastDrawnPrizeIdx !== null){
      delete results[lastDrawnPrizeIdx];
      drawPointer = Math.max(0, drawPointer - 1); // redraw for the same prize, don't advance
    }

    lastDrawnNumber = null;
    lastDrawnPrizeIdx = null;

    document.getElementById('resultOverlay').classList.remove('active');
    drawNumber(); // immediately spin again for the same round
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function showResultModal(finalNumber, prizeIdx){
    const modalText = document.getElementById('resultModalText');
    if(prizeIdx === null){
      // Free Draw Mode: no prize is tied to the number
      modalText.innerHTML = 'Number <span class="num-badge">'+finalNumber+'</span>';
    } else {
      const name = prizes[prizeIdx].name.trim();
      modalText.innerHTML = 'Number <span class="num-badge">'+finalNumber+'</span> wins'
        + (name ? ' <span class="result-prize-name">'+escapeHtml(name)+'</span>' : ' Prize #'+(prizeIdx+1));
    }
    document.getElementById('resultOverlay').classList.add('active');
    spawnConfetti();
  }

  function spawnConfetti(){
    const container = document.getElementById('confettiContainer');
    if(!container) return;
    const colors = ['#f59e0b','#ec4899','#a78bfa','#fde68a','#f472b6','#fbbf24'];
    container.innerHTML = '';
    const pieceCount = 26;
    for(let i=0;i<pieceCount;i++){
      const piece = document.createElement('span');
      piece.className = 'confetti-piece';
      piece.style.left = (Math.random()*100)+'%';
      piece.style.background = colors[Math.floor(Math.random()*colors.length)];
      piece.style.animationDelay = (Math.random()*0.35)+'s';
      piece.style.transform = 'rotate('+Math.floor(Math.random()*360)+'deg)';
      container.appendChild(piece);
    }
    clearTimeout(spawnConfetti._clearTimer);
    spawnConfetti._clearTimer = setTimeout(() => { container.innerHTML = ''; }, 2200);
  }

  function closeResultModal(){
    document.getElementById('resultOverlay').classList.remove('active');
    updateDrawUI();
  }

  function showSummary(){
    const title = document.getElementById('summaryTitle');
    const headerRow = document.getElementById('summaryHeaderRow');
    const tbody = document.getElementById('summaryTableBody');
    tbody.innerHTML = '';

    if(freeMode){
      title.textContent = '🎲 Free Draw Results';
      headerRow.innerHTML = '<th>Draw #</th><th>Number Drawn</th>';
      freeDrawHistory.forEach((num, idx) => {
        const tr = document.createElement('tr');
        tr.innerHTML = '<td>Draw #'+(idx+1)+'</td>'
          + '<td><span class="num-badge">'+num+'</span></td>';
        tbody.appendChild(tr);
      });
    } else {
      title.textContent = '🏆 Prize Draw Results';
      headerRow.innerHTML = '<th>Prize #</th><th>Prize Name</th><th>Number Drawn</th>';
      for(let i=0;i<prizes.length;i++){
        const tr = document.createElement('tr');
        const name = prizes[i].name.trim();
        tr.innerHTML = '<td>Prize #'+(i+1)+'</td>'
          + '<td>'+(name? escapeHtml(name) : '')+'</td>'
          + '<td><span class="num-badge">'+results[i]+'</span></td>';
        tbody.appendChild(tr);
      }
    }
    document.getElementById('summaryOverlay').classList.add('active');
  }

  function endFreeDraw(){
    if(isRolling) return;
    document.getElementById('resultOverlay').classList.remove('active');
    document.getElementById('drawStatusText').textContent = 'Free draw finished 🎊';
    document.getElementById('drawProgressText').textContent = '';
    document.getElementById('startDrawBtn').style.display = 'none';
    document.getElementById('finishBtn').style.display = 'none';
    showSummary();
  }

  function toggleFullscreen(){
    if(!document.fullscreenElement){
      document.documentElement.requestFullscreen().catch(()=>{});
    } else {
      document.exitFullscreen().catch(()=>{});
    }
  }

  document.addEventListener('fullscreenchange', () => {
    const isFs = !!document.fullscreenElement;
    const btn = document.getElementById('fullscreenBtn');
    btn.title = isFs ? 'Exit Full Screen' : 'Full Screen';
    btn.setAttribute('aria-label', btn.title);
    // Hide Back / Full Screen buttons while in fullscreen to avoid overlapping the draw view.
    // They reappear automatically once fullscreen is exited (e.g. via Esc).
    document.getElementById('drawTopbar').style.display = isFs ? 'none' : 'block';
    btn.style.display = isFs ? 'none' : 'flex';
  });

  // ---------- Wire up events ----------
  document.getElementById('addPrizeBtn').addEventListener('click', addPrize);

  document.getElementById('startGameBtn').addEventListener('click', () => {
    if(!validateSetup()) return;
    buildDrawQueue();
    document.getElementById('numberDisplay').textContent = '?';
    document.getElementById('numberDisplay').classList.remove('rolling');
    document.getElementById('summaryOverlay').classList.remove('active');
    document.getElementById('resultOverlay').classList.remove('active');
    updateDrawUI();
    goToPage('page-draw');
  });

  document.getElementById('backBtn').addEventListener('click', () => {
    goToPage('page-setup');
  });

  document.getElementById('fullscreenBtn').addEventListener('click', toggleFullscreen);
  document.getElementById('startDrawBtn').addEventListener('click', drawNumber);
  document.getElementById('finishBtn').addEventListener('click', endFreeDraw);
  document.getElementById('resultCloseBtn').addEventListener('click', closeResultModal);
  document.getElementById('resultRetryBtn').addEventListener('click', retryDraw);
  document.getElementById('closeSummaryBtn').addEventListener('click', () => {
    document.getElementById('summaryOverlay').classList.remove('active');
  });
  document.getElementById('newGameBtn').addEventListener('click', () => {
    document.getElementById('summaryOverlay').classList.remove('active');
    goToPage('page-setup');
  });

  // init with 1 empty prize row for convenience
  addPrize();
})();
</script>
</body>
</html>
